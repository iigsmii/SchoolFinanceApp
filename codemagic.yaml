workflows:
  android-release:
    name: School Finance Android Release
    max_build_duration: 60

    environment:
      java: 11

      android_signing:
        - school_finance_keystore

    scripts:
      - name: Check Gradle
        script: |
          gradle --version

      - name: Generate Gradle Wrapper
        script: |
          gradle wrapper --gradle-version 7.0.2

      - name: Build Android Release APK
        script: |
          chmod +x ./gradlew

          ./gradlew clean assembleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER

    artifacts:
      - app/build/outputs/apk/release/*.apk
