workflows:
  android-release:
    name: School Finance Android Release (Signed)
    max_build_duration: 60

    environment:
      java: 11

      android_signing:
        - school_finance_keystore

    scripts:
      - name: Check Gradle and signing environment
        script: |
          set -e
          gradle --version
          test -n "$CM_KEYSTORE_PATH"
          test -f "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          echo "Android keystore is available to Gradle."

      - name: Generate Gradle Wrapper
        script: |
          set -e
          gradle wrapper --gradle-version 7.0.2

      - name: Build signed Android Release APK
        script: |
          set -e
          chmod +x ./gradlew
          ./gradlew clean assembleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER

      - name: Verify APK is signed
        script: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          if unzip -p "$APK" META-INF/*.RSA META-INF/*.DSA META-INF/*.EC 2>/dev/null | head -c 1 | grep -q .; then
            echo "APK contains a signing certificate."
          else
            echo "ERROR: APK is unsigned."
            exit 1
          fi
          echo "APK: $APK"
          ls -lh "$APK"

    artifacts:
      - app/build/outputs/apk/release/app-release.apk
