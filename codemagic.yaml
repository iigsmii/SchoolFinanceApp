workflows:
  android-release:
    name: School Finance Android APK
    max_build_duration: 60

    environment:
      java: 11

    scripts:
      - name: Check Gradle
        script: |
          gradle --version

      - name: Generate Gradle Wrapper
        script: |
          gradle wrapper --gradle-version 7.0.2

      - name: Build Android APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/**/*.apk
