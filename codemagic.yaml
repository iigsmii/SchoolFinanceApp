workflows:
  android-release:
    name: School Finance Android Release
    max_build_duration: 60

    environment:
      java: 11

      android_signing:
        - school_finance_keystore

    scripts:
      - name: Check Gradle
        script: |
          gradle --version

      - name: Generate Gradle Wrapper
        script: |
          gradle wrapper --gradle-version 7.0.2

      - name: Verify source and build Android Release APK
        script: |
          set -e
          python3 tools/verify_project.py
          chmod +x ./gradlew
          ./gradlew clean assembleRelease \
            -PversionCodeOverride=$((BUILD_NUMBER + 100)) \
            -PversionNameOverride=2.15.$BUILD_NUMBER

      - name: Align, sign and verify APK
        script: |
          set -euo pipefail
          : "${CM_KEYSTORE_PATH:?Missing keystore}"
          : "${CM_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${CM_KEY_ALIAS:?Missing key alias}"
          : "${CM_KEY_PASSWORD:?Missing key password}"
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p app/build/outputs/apk/release-signed
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" /tmp/schoolfinance-aligned.apk
          SIGNED=app/build/outputs/apk/release-signed/SchoolFinanceApp-release-signed.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$CM_KEYSTORE_PATH" --ks-key-alias "$CM_KEY_ALIAS" --ks-pass env:CM_KEYSTORE_PASSWORD --key-pass env:CM_KEY_PASSWORD --out "$SIGNED" /tmp/schoolfinance-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$SIGNED"

    artifacts:
      - app/build/outputs/apk/release-signed/*.apk
