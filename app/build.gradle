apply plugin: 'com.android.application'

android {
    namespace 'com.example.hesabdari'
    compileSdkVersion 33

    defaultConfig {
        applicationId 'com.example.hesabdari'
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 2
        versionName '2.14.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            // Release APK is signed explicitly by the GitHub Actions workflow.
            // This prevents Gradle from silently producing a release artifact
            // that is mistakenly treated as the final signed APK.
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
}
