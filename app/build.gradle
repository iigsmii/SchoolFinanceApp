apply plugin: 'com.android.application'

android {
    namespace 'com.example.hesabdari'
    compileSdkVersion 33

    defaultConfig {
        applicationId 'com.example.hesabdari'
        minSdkVersion 23
        targetSdkVersion 33
        versionCode project.hasProperty('versionCodeOverride') ? project.property('versionCodeOverride').toInteger() : 5
        versionName project.hasProperty('versionNameOverride') ? project.property('versionNameOverride').toString() : '2.15.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
}
