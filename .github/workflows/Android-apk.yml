name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - latest-version.json

concurrency:
  group: android-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Reconcile package lock for native plugins
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Prepare school logo icons
        run: |
          python -m venv .icon-venv
          .icon-venv/bin/pip install Pillow
          .icon-venv/bin/python scripts/generate-icons.py

      - name: Set version for this build
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version")"
          VERSION_PREFIX="$(echo "$BASE_VERSION" | awk -F. '{print $1 "." $2}')"
          APP_VERSION="${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}"
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          VERSION_CODE=$((21600 + GITHUB_RUN_NUMBER))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          GRADLE_FILE="android/app/build.gradle"
          mkdir -p android/app
          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::notice::Gradle file will be created by Capacitor; version will be applied after sync."
          fi

      - name: Build app bundle
        run: npm run build

      - name: Install Capacitor Android tooling
        run: npm install --no-save --no-audit --no-fund @capacitor/cli@6 @capacitor/android@6

      - name: Create and sync Android project
        run: |
          set -euo pipefail
          # Recreate an incomplete Android project if the app module Gradle file is missing.
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          .icon-venv/bin/python scripts/generate-icons.py

      - name: Set Android version
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/app/build.gradle ]; then
            GRADLE_FILE="android/app/build.gradle"
          elif [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          else
            echo "::error::Android app Gradle file is missing after Capacitor sync"
            find android/app -maxdepth 2 -type f -print || true
            exit 1
          fi
          export GRADLE_FILE
          python - <<'PY'
          import os, re, pathlib, sys
          path = pathlib.Path(os.environ["GRADLE_FILE"])
          content = path.read_text()
          content, count_code = re.subn(r'(?m)(\bversionCode\s*=\s*|\bversionCode\s+)[0-9]+', lambda m: m.group(1) + os.environ["VERSION_CODE"], content, count=1)
          content, count_name = re.subn(r'(?m)(\bversionName\s*=\s*|\bversionName\s+)[\'"][^\'"]*[\'"]', lambda m: m.group(1) + '"' + os.environ["APP_VERSION"] + '"', content, count=1)
          if not count_code or not count_name:
              print("Could not find versionCode/versionName in generated Gradle file:", path)
              print("\n".join(line for line in content.splitlines() if "versionCode" in line or "versionName" in line))
              sys.exit(1)
          path.write_text(content)
          print(f"Android version configured: {os.environ['APP_VERSION']} (code {os.environ['VERSION_CODE']})")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/school-finance-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Sign and verify release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unaligned*' -print -quit)"
          if [ -z "$UNSIGNED_APK" ] || [ ! -s "$UNSIGNED_APK" ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="SchoolFinanceApp-${APP_VERSION}-release.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$SIGNED_APK"
          mkdir -p output
          cp "$SIGNED_APK" output/
          cp "$SIGNED_APK" output/SchoolFinanceApp-latest.apk

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SchoolFinanceApp-release-${{ github.run_number }}
          path: output/SchoolFinanceApp-*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK and refresh automatic update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="output/SchoolFinanceApp-latest.apk"
          test -s "$APK_PATH"
          RELEASE_TAG="v${APP_VERSION}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SchoolFinanceApp ${APP_VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "نسخه آماده نصب برنامه SchoolFinanceApp. این انتشار به‌صورت خودکار ساخته شده است."
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/SchoolFinanceApp-latest.apk"
          LAST_CHANGE="$(git log -5 --pretty=format:'%s' | paste -sd '; ' - | sed 's/"/\"/g')"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > latest-version.json <<EOF
          {
            "version": "${APP_VERSION}",
            "apk_url": "${APK_URL}",
            "notes": "${LAST_CHANGE}",
            "build": ${GITHUB_RUN_NUMBER},
            "published_at": "${BUILD_TIME}"
          }
          EOF
          # Update the manifest through the GitHub Contents API using the current file SHA.
          # This avoids a non-fast-forward push when main changes during the Android build.
          MANIFEST_BASE64="$(base64 -w 0 latest-version.json)"
          UPDATED=false
          for attempt in 1 2 3 4 5; do
            CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/latest-version.json" --jq .sha 2>/dev/null || true)"
            if [ -n "$CURRENT_SHA" ]; then
              if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest-version.json" \
                -f message="chore: update latest Android build manifest [skip ci]" \
                -f content="$MANIFEST_BASE64" \
                -f sha="$CURRENT_SHA" \
                -f branch="main" >/dev/null; then
                UPDATED=true
                break
              fi
            else
              if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest-version.json" \
                -f message="chore: initialize latest Android build manifest [skip ci]" \
                -f content="$MANIFEST_BASE64" \
                -f branch="main" >/dev/null; then
                UPDATED=true
                break
              fi
            fi
            sleep 2
          done
          if [ "$UPDATED" != true ]; then
            echo "::error::Could not update latest-version.json after 5 attempts"
            exit 1
          fi
          {
            echo "## نسخه آماده نصب اندروید"
            echo ""
            echo "- نسخه: ${APP_VERSION}"
            echo "- لینک مستقیم آخرین APK: [دانلود برنامه](${APK_URL})"
            echo "- فایل وضعیت به‌روزرسانی: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/latest-version.json"
            echo "- آخرین تغییر ثبت‌شده: ${LAST_CHANGE}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK direct download URL: ${APK_URL}"
