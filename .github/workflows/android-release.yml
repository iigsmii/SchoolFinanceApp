name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.0.2'

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/school_finance_release.jks"

          if [ ! -s "$RUNNER_TEMP/school_finance_release.jks" ]; then
            echo "Keystore file was not created."
            exit 1
          fi

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "One or more signing secrets are missing."
            exit 1
          fi

          gradle clean assembleRelease             -Pandroid.injected.signing.store.file="$RUNNER_TEMP/school_finance_release.jks"             -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"             -Pandroid.injected.signing.key.alias="$KEY_ALIAS"             -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolFinanceApp-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
