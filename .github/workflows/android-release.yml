name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.0.2'

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is missing"; exit 1; }

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/school_finance_release.jks"

          test -s "$RUNNER_TEMP/school_finance_release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/school_finance_release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Keystore and alias verified."

      - name: Build unsigned APK
        run: |
          set -e
          gradle clean assembleRelease
          APK=$(find app/build/outputs/apk/release -type f -name "*unsigned.apk" | head -n 1)
          test -n "$APK"
          echo "Unsigned APK: $APK"

      - name: Zipalign APK
        shell: bash
        run: |
          set -e

          UNSIGNED=$(find app/build/outputs/apk/release -type f -name "*unsigned.apk" | head -n 1)
          test -n "$UNSIGNED"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          test -x "$ZIPALIGN"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/app-aligned.apk"

          "$ZIPALIGN" -c -P 4 -v 4 "$RUNNER_TEMP/app-aligned.apk"

          echo "Zipalign verification PASSED."

      - name: Sign APK with release keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/school_finance_release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/app-aligned.apk"

      - name: Verify signed APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "======================================"
          echo "APK SIGNATURE VERIFICATION PASSED"
          echo "======================================"

      - name: Remove unsigned APK
        run: |
          rm -f app/build/outputs/apk/release/*-unsigned.apk
          rm -f app/build/outputs/apk/release/app-release-unaligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolFinanceApp-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
